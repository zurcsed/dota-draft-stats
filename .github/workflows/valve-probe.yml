name: Valve API probe

# A test branch only: does the Dota API collect matches from GitHub's servers, and how fast?
# The result (numbers only, never the key) is committed to probe-result.txt on this branch.
on:
  push:
    branches: [valve-probe]
    paths: [".github/workflows/valve-probe.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Collect matches for 4 minutes and write the numbers
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.parse, urllib.request, urllib.error
          KEY = os.environ.get("STEAM_API_KEY", "")
          API = "https://api.steampowered.com/IDOTA2Match_570/"
          def get(method, **params):
              url = API + method + "/v1/?" + urllib.parse.urlencode({"key": KEY, **params})
              req = urllib.request.Request(url, headers={"User-Agent": "dota-draft-helper"})
              started = time.time()
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      return resp.status, json.load(resp)["result"], time.time() - started
              except urllib.error.HTTPError as e:
                  return e.code, None, time.time() - started
              except Exception as e:
                  return type(e).__name__, None, time.time() - started
          out = ["key present: %s (length %d)" % (bool(KEY), len(KEY))]
          code, result, took = get("GetMatchHistory", matches_requested=1)
          out.append("GetMatchHistory: %s in %.2f s" % (code, took))
          if result:
              newest = result["matches"][0]["match_seq_num"]
              seq = newest - 200000  # about four hours back: every request has a full hundred
              codes, latencies, matches, kept = {}, [], 0, 0
              started = time.time()
              while time.time() - started < 240:
                  code, result, took = get("GetMatchHistoryBySequenceNum", start_at_match_seq_num=seq, matches_requested=100)
                  codes[str(code)] = codes.get(str(code), 0) + 1
                  latencies.append(took)
                  if result and result.get("matches"):
                      got = result["matches"]
                      matches += len(got)
                      kept += sum(1 for m in got if m.get("human_players") == 10 and m.get("game_mode") == 22)
                      seq = got[-1]["match_seq_num"] + 1
                  elif code == 429:
                      time.sleep(15)
                  time.sleep(1.0)
              elapsed = time.time() - started
              latencies.sort()
              out.append("requests: %d, codes: %s" % (len(latencies), codes))
              out.append("latency: median %.2f s, 95th %.2f s, slowest %.2f s" % (latencies[len(latencies) // 2], latencies[int(len(latencies) * 0.95)], latencies[-1]))
              out.append("matches: %d in %.0f s = %.0f per hour (all pick with 10 humans: %d)" % (matches, elapsed, matches / elapsed * 3600, kept))
          text = "\n".join(out)
          print(text)
          open("probe-result.txt", "w").write(text + "\n")
          PY
      - name: Commit the numbers to this branch
        run: |
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe-result.txt
          git commit -m "Valve probe result [skip ci]"
          git push origin HEAD:valve-probe
